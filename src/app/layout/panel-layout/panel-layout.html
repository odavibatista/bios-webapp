<mat-sidenav-container class="panel">
  <mat-sidenav class="panel-menu" mode="side" [opened]="!narrow()">
    <nav aria-label="Áreas do painel">
      <mat-nav-list>
        @for (item of items(); track item.path) {
          <a
            mat-list-item
            [routerLink]="item.path"
            routerLinkActive
            #active="routerLinkActive"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
            ariaCurrentWhenActive="page"
            [activated]="active.isActive"
          >
            <mat-icon matListItemIcon fontSet="material-symbols-outlined" aria-hidden="true">
              {{ item.icon }}
            </mat-icon>
            <span matListItemTitle>{{ item.label }}</span>
          </a>
        }
      </mat-nav-list>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content class="panel-content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
