<h1>Alterar a senha</h1>
<p class="lead">
  Ao salvar, todas as sessões abertas são encerradas, inclusive esta, e você entra de novo com a
  nova senha.
</p>

<bios-form-error-summary [messages]="formErrors()" />

<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <bios-password-field
    [control]="form.controls.current_password"
    label="Senha atual"
    autocomplete="current-password"
  />
  <bios-password-field
    [control]="form.controls.new_password"
    label="Nova senha"
    [showPolicy]="true"
  />

  <div class="actions">
    <button mat-flat-button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Salvando…' : 'Salvar nova senha' }}
    </button>
  </div>
</form>
