@if (invalidLink(); as message) {
  <div role="alert">
    <h1>Não foi possível redefinir a senha</h1>
    <p class="lead">{{ message }}</p>
  </div>
  <div class="actions">
    <a mat-flat-button routerLink="/esqueci-senha">Pedir outro link</a>
  </div>
} @else {
  <h1>Definir nova senha</h1>
  <p class="lead">
    Escolha a nova senha da sua conta. Ao salvar, todas as sessões abertas são encerradas.
  </p>

  <bios-form-error-summary [messages]="formErrors()" />

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <bios-password-field
      [control]="form.controls.new_password"
      label="Nova senha"
      [showPolicy]="true"
    />

    <div class="actions">
      <button mat-flat-button type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Salvando…' : 'Salvar nova senha' }}
      </button>
    </div>
  </form>
}
