@switch (state()) {
  @case ('loading') {
    <p class="status" role="status">Carregando a documentação da API…</p>
  }
  @case ('failed') {
    <p class="status" role="alert">
      Não foi possível abrir a documentação da API. Confira a conexão e recarregue a página.
    </p>
  }
}
<div #host class="reference" [class.hidden]="state() !== 'ready'"></div>
