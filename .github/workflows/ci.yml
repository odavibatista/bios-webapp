# Integração contínua do webapp: análise estática, testes e build (sem deploy).
#
# Roda em todo pull request e push para os branches da convenção do projeto
# (develop → pre-prod → main). Os jobs "Lint" e "Testes" são os status checks
# exigidos pela proteção de branches (RNF NFSE11), com os mesmos nomes do bios-core-api.

name: CI

on:
  pull_request:
    branches: [develop, pre-prod, main]
  push:
    branches: [develop, pre-prod, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Hooks do Husky são locais; no CI as verificações rodam explicitamente.
  HUSKY: '0'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Histórico completo: o commitlint precisa dos commits da base e do head
          # do PR para validar todas as mensagens do intervalo.
          fetch-depth: 0

      # A versão do Node vem do campo `volta` do package.json, a mesma do desenvolvimento.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm

      # O lockfile e o `allowScripts` são do npm 11; o Node 22 traz o npm 10.
      - name: Alinhar versão do npm com a do lockfile
        run: npm install -g npm@11.21.1

      - name: Instalar dependências
        run: npm ci

      - name: Mensagens de commit (Conventional Commits)
        if: github.event_name == 'pull_request'
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      - name: Título do pull request (Conventional Commits)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --verbose

      - name: ESLint (NFSE10)
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Verificação de tipos
        run: npm run typecheck

  test:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Alinhar versão do npm com a do lockfile
        run: npm install -g npm@11.21.1

      - name: Instalar dependências
        run: npm ci

      - name: Testes unitários (cobertura mínima de 75% — NFPD03)
        run: npm run test:cov

      - name: Build de produção (orçamento de tamanho do bundle)
        run: npm run build

      - name: Navegador dos testes e2e
        run: npx playwright install --with-deps chromium

      - name: Testes e2e (Playwright)
        run: npm run test:e2e

      - name: Resumo de cobertura
        if: ${{ !cancelled() && hashFiles('coverage/bios-webapp/coverage-summary.json') != '' }}
        run: |
          node -e "
            const { total } = JSON.parse(require('fs').readFileSync('coverage/bios-webapp/coverage-summary.json', 'utf8'));
            const rows = ['lines', 'statements', 'functions', 'branches']
              .map((metric) => '| ' + metric + ' | ' + total[metric].pct + '% |');
            console.log(['### Cobertura de testes', '', '| Métrica | Cobertura |', '| --- | --- |', ...rows].join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatório de cobertura
        if: ${{ !cancelled() && hashFiles('coverage/**') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Publicar relatório do Playwright
        if: ${{ !cancelled() && hashFiles('playwright-report/**') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
