# Monitoramento e atualização de dependências (RNF NFSE08).
#
# Atualizações de versão abrem PRs semanais contra o develop, agrupadas por
# ecossistema para reduzir o volume de PRs. Alertas e atualizações de
# segurança são habilitados nas configurações do repositório e não dependem
# deste agendamento.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels: [chore, dependencies]
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', '@schematics/*', angular-eslint]
      graficos:
        patterns: [echarts, ngx-echarts]
      lint-e-formatacao:
        patterns:
          - eslint
          - '@eslint/*'
          - typescript-eslint
          - prettier
      testes:
        patterns: [vitest, '@vitest/*', '@testing-library/*', jsdom, '@playwright/test']
      qualidade-de-commit:
        patterns: [husky, lint-staged, '@commitlint/*']
    ignore:
      # O TypeScript acompanha o teto que o Angular declara (`>=6.0 <6.1` no @angular/build).
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Os tipos do Node seguem a série do Node do projeto (22, no campo `volta`).
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    labels: [chore, dependencies]
    commit-message:
      prefix: ci
      include: scope
